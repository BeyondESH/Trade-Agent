<text x="88" y="654" font-size="11.5" fill="#111827" font-weight="700">Tier 1 — research.py (LLM)</text>
<text x="88" y="671" font-size="10" fill="#475569">deepagents + langgraph · tools.py + tool_policy.py</text>
<text x="88" y="687" font-size="10" fill="#475569">read-only toolset → StrategyProposal</text>
<text x="88" y="703" font-size="10" fill="#9333ea">the ONLY module that instantiates an LLM</text>
<rect x="490" y="634" width="404" height="82" rx="8" ry="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="500" y="654" font-size="11.5" fill="#111827" font-weight="700">Tier 2 — execution.py (deterministic · 0 LLM)</text>
<text x="500" y="671" font-size="10" fill="#475569">langgraph StateGraph · broker.py PaperBroker</text>
<text x="500" y="687" font-size="10" fill="#475569">plan_position from paper equity · fail_closed</text>
<text x="500" y="703" font-size="10" fill="#6d28d9">runtime.py drives the loop, owns both graphs</text>
<text x="78" y="752" font-size="10.2" fill="#475569">One PostgresSaver shared by both compiled graphs · worker is the sole checkpointer writer ·</text>
<text x="78" y="766" font-size="10.2" fill="#475569">FastAPI only READS the agent projections (proposals / runs / stream_events).</text>
