<text x="40" y="46" font-size="24" fill="#0f172a" font-weight="700">Backend Runtime Architecture — market-data (FastAPI + agent worker)</text>
<text x="40" y="72" font-size="12.5" fill="#6b7280">rev 40a337c · compose stack: dev (uvicorn :8181 + vite :5173) + postgres (postgres:16 · 5433→5432) · single persistence layer = PostgreSQL · legacy data/ files are audit-only</text>
