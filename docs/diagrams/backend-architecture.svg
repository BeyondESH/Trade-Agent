<text x="804" y="477" font-size="9.5" fill="#64748b" text-anchor="middle">psycopg_pool + bootstrap()</text>
<text x="398" y="516" font-size="10.2" fill="#475569">Both processes instantiate db.py (PostgreSQL pool); a dead database</text>
<text x="398" y="531" font-size="10.2" fill="#475569">fails startup loudly (DatabaseUnavailable → HTTP 503), never empty data.</text>
