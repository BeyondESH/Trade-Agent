<text x="78" y="838" font-size="10.2" fill="#475569">trade-data → /workspace/backend/data  (legacy Parquet day-files + JSON/JSONL — audit / re-run only)</text>
<text x="78" y="852" font-size="10.2" fill="#475569">read-only bind /src-ro ← host repo (rsync source for scripts/dev-sync.sh)</text>
