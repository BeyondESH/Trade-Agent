# ---------------------------------------------------------------------------
# Docker Compose dev environment for Trade-Agent — NATIVE WORKING COPY model,
# ALWAYS-ON stack.
#
# The repository is NOT bind-mounted. The container keeps its own working copy
# on ext4 inside the `trade-workspace` named volume; the Windows tree is
# bind-mounted READ-ONLY at /src-ro and mirrored in one-way by
# `scripts/dev-sync.sh` (rsync host -> container). Everything (git, pytest,
# vitest, pnpm) then runs inside the container on native ext4.
#
# Why: the previous design bind-mounted the repo over 9p/virtiofs. That made
# `git` crash with SIGBUS (git memory-maps its pack file; 9p cannot reliably
# back the page fault) and slowed pytest to 462-547 s (vs ~104 s on the host).
#
# SERVICES
#   dev       interactive toolbox (shell / exec / tests / sync). No published
#             ports; run it alone with `docker compose up -d dev`.
#   backend   FastAPI/uvicorn on 0.0.0.0:8181, published as 8181:8181.
#   frontend  vite dev server on 0.0.0.0:5173, published as 5173:5173.
#
# All three share the `trade-dev:latest` image and the `trade-workspace` /
# `trade-data` volumes, so `backend` and `frontend` serve the SAME synced
# working copy the developer edits into. They start by default (no compose
# profile) because the intent is "the project is always up, I just open the
# browser"; use `docker compose up -d dev` for a dev-only (no servers) stack.
#
# AUTOSTART: every service carries `restart: unless-stopped`, so the stack
# resumes after a dockerd / WSL-distro restart — but a service you stopped on
# purpose stays stopped. WSL itself is started by the user; docker.service is
# already enabled in systemd, so nothing else is required.
#
# Docker Engine lives INSIDE WSL, not on Windows. Run everything from WSL:
#   wsl.exe -d Ubuntu-26.04 -- bash -lc \
#     'cd /mnt/d/work/project/trade && scripts/dev-sync.sh up'
#
# ⚠️  DANGER: `docker compose down -v` DELETES THE NAMED VOLUMES — and the
#     entire working tree lives in `trade-workspace`. `down -v` therefore
#     destroys your working copy (you would have to re-sync from scratch).
#     Always use plain `docker compose down`.
#
# See docs/docker-dev.md for the full operational guide.
# ---------------------------------------------------------------------------

name: trade

services:
  # -------------------------------------------------------------------------
  # dev — the interactive working container (shell / exec / tests / sync).
  # It serves no traffic; the long-running servers are `backend`/`frontend`.
  # -------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: trade-dev:latest
    init: true          # reap orphaned children (vite / uvicorn / node spawn subprocesses)
    tty: true           # let `docker compose exec dev bash` be interactive
    stdin_open: true
    # Come back after a dockerd/distro restart, but stay down if stopped by hand.
    restart: unless-stopped
    working_dir: /workspace
    # Match the WSL host uid/gid (1000:1000). The named volumes are pre-owned by
    # 1000 in the image, so uid 1000 can write the working copy directly.
    user: "1000:1000"
    command: ["sleep", "infinity"]
    environment:
      # Bind vite to 0.0.0.0 so the Windows browser can reach the published port.
      DEV_SERVER_HOST: "0.0.0.0"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      # uv's default hardlink install fails across filesystems; keep copy mode.
      UV_LINK_MODE: "copy"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      # READ-ONLY mirror of the Windows source tree — the sync SOURCE only.
      # Nothing ever writes here; the repo itself is never bind-mounted.
      - type: bind
        source: ${TRADE_SRC:-/mnt/d/work/project/trade}
        target: /src-ro
        read_only: true
      # The native working copy (ext4). git + tests run here at full speed.
      - trade-workspace:/workspace
      # Backend data has its own volume: the container never writes the host's
      # parquet store, and `--delete` syncs never touch it.
      - trade-data:/workspace/backend/data
    # NOTE: the 8181/5173 port publications now live on the dedicated `backend`
    # and `frontend` services. Two containers cannot bind the same host port,
    # and `dev` never serves traffic — so it publishes nothing.

  # -------------------------------------------------------------------------
  # backend — FastAPI/uvicorn, always-on. Reachable at http://127.0.0.1:8181.
  # Shares the image + volumes above, so it runs the synced working copy.
  # -------------------------------------------------------------------------
  backend:
    # Shares the image built by `dev` (single build, single image). Always start
    # the stack with `--build` (e.g. `docker compose up -d --build`), which
    # builds `dev` first; `backend`/`frontend` then use that image.
    image: trade-dev:latest
    init: true
    restart: unless-stopped
    working_dir: /workspace/backend
    user: "1000:1000"
    environment:
      DEV_SERVER_HOST: "0.0.0.0"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      UV_LINK_MODE: "copy"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # 0 disables the incremental-persistence scheduler in this always-on dev
      # stack: no continuous background ingestion / external REST polling while
      # the container idles (matches scripts/dev-sync.sh's `backend` subcommand).
      # Set to a positive number of seconds to enable periodic ingestion.
      MD_SCHEDULE_INTERVAL_SECONDS: "0"
    volumes:
      - trade-workspace:/workspace
      - trade-data:/workspace/backend/data
    ports:
      - "8181:8181"     # backend API
    # Wait for the sync/install to have happened instead of crash-looping on a
    # fresh volume; fail with a clear message if .venv never appears.
    command:
      - bash
      - -lc
      - |
        waited=0
        while [ ! -x .venv/bin/python ]; do
          if [ "$$waited" -ge 300 ]; then
            echo "[backend] ERROR: /workspace/backend/.venv is missing after 300s." >&2
            echo "[backend]        Populate the working copy: scripts/dev-sync.sh sync" >&2
            exit 1
          fi
          echo "[backend] waiting for backend/.venv (run: scripts/dev-sync.sh sync) ..." >&2
          sleep 5
          waited=$$((waited + 5))
        done
        exec .venv/bin/python -m uvicorn market_data.webapi:create_app --factory \
          --host 0.0.0.0 --port 8181

  # -------------------------------------------------------------------------
  # frontend — vite dev server, always-on. Reachable at http://127.0.0.1:5173.
  # HMR works without polling: the working copy is native ext4, so inotify is
  # live (CHOKIDAR_USEPOLLING is deliberately NOT set).
  # -------------------------------------------------------------------------
  frontend:
    image: trade-dev:latest
    init: true
    restart: unless-stopped
    working_dir: /workspace/frontend
    user: "1000:1000"
    environment:
      DEV_SERVER_HOST: "0.0.0.0"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      UV_LINK_MODE: "copy"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - trade-workspace:/workspace
      # Mounted for parity with `dev`/`backend`; the frontend never writes it.
      - trade-data:/workspace/backend/data
    ports:
      - "5173:5173"     # vite dev server
    command:
      - bash
      - -lc
      - |
        waited=0
        while [ ! -x node_modules/.bin/vite ]; do
          if [ "$$waited" -ge 300 ]; then
            echo "[frontend] ERROR: /workspace/frontend/node_modules is missing after 300s." >&2
            echo "[frontend]        Populate the working copy: scripts/dev-sync.sh sync" >&2
            exit 1
          fi
          echo "[frontend] waiting for frontend/node_modules (run: scripts/dev-sync.sh sync) ..." >&2
          sleep 5
          waited=$$((waited + 5))
        done
        exec npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  # Explicit `name:` pins the real Docker volume names (instead of the
  # project-prefixed `trade_trade-workspace`), matching docs and `doctor`.
  trade-workspace:
    name: trade-workspace
  trade-data:
    name: trade-data
