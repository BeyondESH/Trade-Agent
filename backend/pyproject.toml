[project]
name = "market-data"
version = "0.1.0"
description = "Bitget market-data foundation: MCP-based kline ingestion, Parquet store, Excel export, scheduled jobs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "numpy>=2.4",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "APScheduler>=3.10",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Runtime HTTP client: imported directly by webapi.py, ingestion.py,
    # streamhub.py and blockbeats.py (not only by the test suite).
    "httpx>=0.28",
    "websockets>=12",
    "akshare>=1.14.0",
    # --- Deep Agents research layer + deterministic LangGraph execution layer ---
    # Pinned: the removal/rebuild spike verified this exact set installs and
    # imports on the project's CPython runtime (StateGraph + checkpointer +
    # interrupt/Command(resume) + create_deep_agent). CI must use the same set.
    "deepagents==0.7.19",
    "langgraph==1.2.12",
    "langchain==1.4.3",
    # Checkpointer backend (Phase-2 foundation): both graphs persist to PostgreSQL.
    # The sync APScheduler worker uses the sync `PostgresSaver` (psycopg 3);
    # `psycopg-pool` is a declared dependency of the Postgres checkpoint package
    # (used by its async/pool path) and is pinned explicitly so we never rely on
    # transitive resolution.
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    # Explicit provider dep (deepagents pulls it transitively; we do not rely on
    # transitive deps). Default model is `anthropic:claude-sonnet-4-6`.
    "langchain-anthropic",
]

[project.scripts]
market-data = "market_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[dependency-groups]
# Development-only tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "integrity: full PostgreSQL candle data quality gate (L1)",
    "live: real-process API/WS tests against a spawned uvicorn (L2)",
    "online: tests that require external network (Bitget/BlockBeats), skipped when unreachable",
    "db: tests backed by the PostgreSQL test database, skipped when Postgres is unreachable",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/market_data/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Rules intentionally NOT ignored are enforced by CI (see .github/workflows/ci.yml).
# Any rule disabled below MUST carry the reason + the ratchet plan to re-enable it.
ignore = [
    # B008 (function-call-in-default-argument) fires on FastAPI's idiomatic
    # `Depends()` / `Body()` defaults, which are the framework's documented
    # dependency-injection pattern. Ratchet: re-enable if we migrate to
    # Annotated-style dependencies everywhere.
    "B008",
]

[tool.coverage.run]
source = ["market_data"]
branch = false

[tool.coverage.report]
# Ratchet policy ("只升不降"): measured baseline at introduction was 81% total
# (356 unit tests, `pytest -q -m "not integrity and not live and not online"`).
# The gate is this baseline floored DOWN to a multiple of 5, so it can never be
# above the measured value. Future changes MUST only raise it, never lower it.
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
