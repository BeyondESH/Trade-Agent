[project]
name = "market-data"
version = "0.1.0"
description = "Bitget market-data foundation: MCP-based kline ingestion, Parquet store, Excel export, scheduled jobs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "APScheduler>=3.10",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "akshare>=1.14.0",
]

[project.scripts]
market-data = "market_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "integrity: full parquet data quality gate (L1)",
    "live: real-process API/WS tests against a spawned uvicorn (L2)",
    "online: tests that require external network (Bitget/BlockBeats), skipped when unreachable",
]
testpaths = ["tests"]
